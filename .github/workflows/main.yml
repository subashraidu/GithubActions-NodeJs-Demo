name: This workflow will download the file
on:
  push:
    branches:
     - master
jobs: 
  upload_file:
    runs-on: ubuntu-latest
    steps:
     - name: create a directory
       run: mkdir myfiles
     - name: create a file in directory
        run: echo "hello" > /myfiles/file1
     - name: upload the file to github
        uses: actions/upload-artifact@v4
        with: 
           name: my-file
           path: /myfiles/file1   
  download_file:
    runs-on: ubuntu-latest
    needs: upload_file
    steps:
     - name: download the artifact from previous job to this job 
       uses: actions/download-artifact@v4
       with:
        name: my-file
     - name: check if the file is on runner or not
        run: ls -ltrh
