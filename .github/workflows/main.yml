name: build node application
on:
  push:
    branches:
      - master
jobs:
  buildJobs:
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@v5
      - name: Install nodejs
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
         
      - name: Install dependencies
        run: npm ci
      - name: run test cases
        run: npm test
      - name: build code
        run: npm run build

